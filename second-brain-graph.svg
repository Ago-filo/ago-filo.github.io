<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative graph of example notes</title>
  <desc id="desc">Example note topics linked to a central personal knowledge base. The graph is a visual concept, not a screenshot of private notes.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#304243"/><stop offset="1" stop-color="#182530"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#d9ed83" stop-opacity=".38"/><stop offset="1" stop-color="#d9ed83" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="740" height="340" rx="10" fill="url(#bg)"/>
  <g stroke="#a3c3b4" stroke-width="1.3" opacity=".5" fill="none">
    <path d="M356 166 176 83M356 166 119 201M356 166 250 273M356 166 502 84M356 166 616 154M356 166 536 266M176 83 502 84M119 201 250 273M250 273 536 266M502 84 616 154M616 154 536 266"/>
  </g>
  <g fill="#a9c987" opacity=".55"><circle cx="213" cy="102" r="3"/><circle cx="458" cy="113" r="2.5"/><circle cx="458" cy="229" r="3"/><circle cx="194" cy="232" r="2.5"/></g>
  <circle cx="356" cy="166" r="89" fill="url(#halo)"/>
  <circle cx="356" cy="166" r="33" fill="#d9ed83" fill-opacity=".25" filter="url(#glow)"/>
  <circle cx="356" cy="166" r="22" fill="#d9ed83" stroke="#eff9be" stroke-width="2"/>
  <g fill="#b9d28f" stroke="#dce9b9" stroke-width="1.3"><circle cx="176" cy="83" r="11"/><circle cx="119" cy="201" r="9"/><circle cx="250" cy="273" r="12"/><circle cx="502" cy="84" r="10"/><circle cx="616" cy="154" r="13"/><circle cx="536" cy="266" r="10"/></g>
  <g fill="#e9f0e8" font-family="Arial,sans-serif" font-size="13" font-weight="600"><text x="354" y="215" text-anchor="middle">Knowledge base</text><text x="176" y="58" text-anchor="middle">Project notes</text><text x="119" y="176" text-anchor="middle">Decisions</text><text x="250" y="307" text-anchor="middle">Procedures</text><text x="502" y="59" text-anchor="middle">Sources</text><text x="616" y="189" text-anchor="middle">Questions</text><text x="536" y="301" text-anchor="middle">Evaluation</text></g>
</svg>

