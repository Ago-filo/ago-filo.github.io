<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Matilde Agosti — Anteprima</title><style>*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#eeece6;color:#302f29;font:15px/1.7 Arial,sans-serif}a{color:inherit}select{font:inherit}.home-view{display:block;width:100%;height:100vh;height:100svh;min-height:600px;border:0;background:#19241f}.comparison{max-width:1400px;margin:auto;padding:35px 30px 55px}.controls{display:flex;gap:25px;flex-wrap:wrap;align-items:end;background:#faf7ef;padding:22px;border:1px solid #d7d4c9;margin:0 0 18px}label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}select{padding:10px 12px;border:1px solid #aaa99c;background:white;color:#302f29;max-width:100%}.open{margin-left:auto;font-size:12px}.viewer{display:block;width:100%;height:850px;background:#19241f;border:1px solid #d7d4c9}.description{font-size:13px;color:#66675d;max-width:850px;margin:16px 0 0}a:focus-visible,select:focus-visible{outline:2px solid #ad654a;outline-offset:4px}@media(max-width:650px){.comparison{padding:20px 16px 35px}.controls{gap:15px;padding:17px}.controls>div{width:100%}select{width:100%}.open{margin:0}.viewer{height:1000px}.home-view{min-height:580px}}</style></head><body><main><iframe class="home-view" src="proposte-matilde-agosti.html" title="Home di Matilde Agosti"></iframe><section class="comparison" aria-label="Proposte per le pagine interne"><div class="controls"><div><label for="style">Impostazione</label><select id="style"><option value="panoramica">01 · Apertura panoramica</option><option value="editoriale">02 · Editoriale</option><option value="intera">03 · Fotografia intera</option></select></div><div><label for="page">Pagina</label><select id="page"><option value="about">About</option><option value="projects">Projects</option><option value="download">Download</option><option value="contact">Contact</option></select></div><a class="open" id="open" href="previews/panoramica-about.html" target="_blank" rel="noopener">Apri questa proposta a piena pagina ↗</a></div><iframe class="viewer" id="viewer" src="previews/panoramica-about.html" title="Anteprima About, Apertura panoramica"></iframe><p class="description" id="description"></p></section></main><script>
