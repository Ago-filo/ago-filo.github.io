<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1116">
  <title>Second Brain · Demo di onboarding IT</title>
  <link rel="stylesheet" href="../portfolio-tokens.css">
  <script src="filmed-run.js?v=2" defer></script>
  <script src="replay.js?v=2" defer></script>
  <style>
    /* Hallmark · macrostructure: Workbench · tone: editorial · anchor hue: blue
       pre-emit critique: P4 H5 E4 S5 R5 V4 */
    :root { font-family: var(--font-body); background: var(--color-paper); color: var(--color-ink); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    html, body { overflow-x: clip; }
    main { max-width: 1080px; margin: auto; padding: var(--space-lg) var(--space-md) var(--space-2xl); }
    a { color: var(--color-accent); text-underline-offset: 4px; }
    nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-xs); font-size: var(--text-small); }
    h1, h2 { font-family: var(--font-display); overflow-wrap: anywhere; }
    h1 { margin: var(--space-xl) 0 var(--space-xs); letter-spacing: -.045em; font-size: clamp(2.4rem, 6vw, 4.3rem); line-height: 1; }
    p { line-height: 1.6; }
    .lead { margin: 0 0 var(--space-lg); color: var(--color-muted); }
    .questions { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-md); }
    button { font: inherit; font-size: .9rem; color: inherit; background: var(--color-panel); border: 1px solid var(--color-rule); border-radius: var(--radius-control); padding: .65rem .9rem; cursor: pointer; }
    button:hover { background: var(--color-hover); }
    button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); font-weight: 650; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 4px; }
    .result { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); border-block: 1px solid var(--color-rule); }
    .response { min-width: 0; padding: var(--space-md) var(--space-lg) var(--space-md) 0; }
    .sources { min-width: 0; padding: var(--space-md); background: var(--color-panel); border-left: 1px solid var(--color-rule); }
    h2 { margin: 0 0 var(--space-xs); font-size: clamp(1.2rem, 2.2vw, 1.55rem); }
    .answer { margin: 0; white-space: pre-line; }
    blockquote { margin: var(--space-sm) 0 0; padding-left: var(--space-sm); border-left: 2px solid var(--color-accent); }
    blockquote p { margin: 0 0 var(--space-xs); font-size: .95rem; color: var(--color-muted); }
    blockquote cite { font-size: .82rem; color: var(--color-accent); font-style: normal; }
    footer { margin-top: var(--space-md); font-size: var(--text-small); color: var(--color-muted); }
    @media (max-width: 700px) {
      main { padding: var(--space-md) var(--space-sm) var(--space-xl); }
      .result { grid-template-columns: minmax(0, 1fr); }
      .response { padding: var(--space-md) 0; }
      .sources { border-left: 0; border-top: 1px solid var(--color-rule); padding: var(--space-sm); }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Navigazione"><a href="../laboratorio/index.html#second-brain">← Laboratorio</a><a href="second-brain.zip" download>Codice e prove ↓</a></nav>
    <h1>Chiedi alle procedure IT</h1>
    <p class="lead">Second Brain · scegli una domanda di onboarding e confronta la risposta con le note.</p>
    <div class="questions" role="group" aria-label="Domande di esempio">
      <button type="button" data-question="vpn" aria-pressed="true">VPN bloccata</button>
      <button type="button" data-question="account" aria-pressed="false">Account bloccato</button>
      <button type="button" data-question="budget" aria-pressed="false">Budget hardware</button>
    </div>
    <div class="result" aria-live="polite">
      <article class="response" aria-labelledby="question">
        <h2 id="question"></h2>
        <p id="answer" class="answer text"></p>
      </article>
      <aside class="sources" aria-labelledby="source-heading">
        <h2 id="source-heading">Dalle note</h2>
        <div id="sources"></div>
      </aside>
    </div>
    <footer>Risposte di esempio ed estratti dalle note fittizie. Il modello gira nella configurazione locale.</footer>
  </main>
</body>
</html>
